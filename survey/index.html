<!DOCTYPE html>
<html lang="ja">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>YORIMICHI アンケート</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#3E3A39;--card:#2d2926;--card2:#231f1d;
  --red:#E63B10;--red-d:#c42e08;
  --text:#EFEFEF;--sub:#a09a97;
  --border:rgba(239,239,239,0.12);
  --r:12px;--shadow:0 4px 24px rgba(0,0,0,0.5);
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,'Noto Sans JP',sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:24px 16px;min-height:100vh}
.wrap{width:100%;max-width:420px}

.logo{text-align:center;margin-bottom:28px}
.logo-title{font-size:26px;font-weight:700;letter-spacing:5px}
.logo-title span{color:var(--red)}
.logo-sub{font-size:11px;color:var(--sub);letter-spacing:3px;margin-top:6px}

.card{background:var(--card);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}

.progress{display:flex;gap:8px;margin-bottom:24px}
.pstep{flex:1;height:4px;border-radius:2px;background:var(--border);transition:background .3s}
.pstep.on{background:var(--red)}

.q-step{font-size:12px;color:var(--sub);font-weight:500;letter-spacing:.5px;margin-bottom:6px}
.q-title{font-size:16px;font-weight:700;line-height:1.55;margin-bottom:6px}
.q-note{font-size:12px;color:var(--sub);margin-bottom:16px}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;align-items:center;gap:12px;
  background:var(--card2);border:1.5px solid var(--border);border-radius:10px;
  padding:13px 15px;cursor:pointer;transition:border-color .15s,background .15s;
  user-select:none;
}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--red);background:rgba(230,59,16,.08)}
.mark{
  width:20px;height:20px;flex-shrink:0;border-radius:50%;border:2px solid var(--sub);
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.checkbox .mark{border-radius:5px}
.opt.sel .mark{background:var(--red);border-color:var(--red)}
.checkmark{display:none;width:11px;height:11px}
.opt.sel .checkmark{display:block}
.opt-text{font-size:14px;font-weight:500;line-height:1.4}

.txt{
  width:100%;background:var(--card2);border:1.5px solid var(--border);border-radius:10px;
  padding:13px 15px;color:var(--text);font-size:14px;font-family:inherit;
}
.txt:focus{outline:none;border-color:var(--red)}

.btn{
  width:100%;padding:15px;border-radius:10px;border:none;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
  letter-spacing:.5px;margin-top:22px;transition:all .2s;
}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:var(--red-d)}
.btn-red:active{transform:scale(.98)}
.btn-red:disabled{background:#4a2e28;color:#666;cursor:not-allowed;transform:none}
.btn-back{background:transparent;border:1.5px solid var(--border);color:var(--sub);margin-top:10px}

.view{display:none}
.view.on{display:block}

.loading{text-align:center;color:var(--sub);font-size:13px;padding:24px 0}

.done-wrap{text-align:center;padding:12px 0}
.done-icon{margin-bottom:18px}
.done-logo{width:110px;height:110px;border-radius:50%;object-fit:contain;background:#fff;padding:8px;box-shadow:0 4px 20px rgba(0,0,0,0.4)}
.done-title{font-size:20px;font-weight:700;margin-bottom:10px}
.done-body{font-size:14px;color:var(--sub);line-height:1.7;margin-bottom:24px}
.countdown{font-size:13px;color:var(--sub)}
.countdown span{font-size:30px;font-weight:700;color:var(--text);display:block;margin-bottom:4px}
</style>
</head>
<body>
<div class="wrap">

  <div class="logo">
    <div class="logo-title">YORI<span>M</span>ICHI</div>
    <div class="logo-sub">POKER ROOM · NUMAZU</div>
  </div>

  <div class="card">
    <!-- 設問はJSファイルが設問マスタから動的生成する -->
    <div id="qhost">
      <div class="loading" id="loading">読み込み中…</div>
    </div>

    <!-- 完了 -->
    <div class="view" id="v-done">
      <div class="done-wrap">
        <div class="done-icon"><img src="logo.png" class="done-logo" alt="YORIMICHI"></div>
        <div class="done-title">ありがとうございます！</div>
        <div class="done-body">アンケートへのご回答<br>ありがとうございました。<br>続けてアカウント登録をお願いします。</div>
        <div class="countdown">
          <span id="cnt">3</span>
          秒後に登録ページへ移動します
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ========================================================
// GAS ウェブアプリURL（設定配信＆回答記録）／PPP登録URL … 変更不可
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwwH3q2ynIl_PoHLYGn65rvJQOnGrZFdb2zH-jRry_TWmBW3Ug-UFpFJNwynz-5nrmfIQ/exec';
const PPP_URL = 'https://ppp.arkadia.bet/login';
// ========================================================

// GAS/設問マスタが読めない時の保険（現行5問と同一）
const FALLBACK_QUESTIONS = [
  { id:'age', title:'年代を教えてください', note:'', type:'single',
    options:['10代','20代','30代','40代','50代','60代以上'] },
  { id:'gender', title:'性別を教えてください', note:'', type:'single',
    options:['男性','女性','その他','回答しない'] },
  { id:'referral', title:'YORIMICHIをどこでお知りになりましたか？', note:'複数選択できます', type:'multi',
    options:['Instagramの投稿','Instagramの広告','X（Twitter）','友人・知人の紹介','Google検索','Googleマップ・口コミ','看板・チラシ','その他'] },
  { id:'motive', title:'今回ご来店の決め手は何ですか？', note:'複数選択できます', type:'multi',
    options:['Instagramの投稿を見て','Instagramの広告を見て','X（旧Twitter）の投稿を見て','友人・知人に紹介されて','Google等で検索して','Googleマップ・口コミを見て','看板・チラシを見て','以前来たことがあって','その他'] },
  { id:'experience', title:'ポーカーのご経験を教えてください', note:'', type:'single',
    options:['未経験（初めて）','初心者（数回程度）','経験者（定期的にプレイ）','上級者（競技経験あり）'] }
];

let QS = [];            // 実際に使う設問配列
let state = [];         // 回答状態（設問ごと）
let cur = 0;            // 現在の設問index

// ===== 設定読込（JSONP） =====
let cfgDone = false;
function onConfig(data){
  if (cfgDone) return; cfgDone = true;
  const qs = (data && data.ok && data.questions && data.questions.length) ? data.questions : FALLBACK_QUESTIONS;
  boot(qs);
}
function useFallback(){ if (cfgDone) return; cfgDone = true; boot(FALLBACK_QUESTIONS); }

(function loadConfig(){
  window.onConfig = onConfig;
  const s = document.createElement('script');
  s.src = GAS_URL + '?action=config&callback=onConfig&_=' + new Date().getTime();
  s.onerror = useFallback;
  document.head.appendChild(s);
  setTimeout(useFallback, 3500); // 応答が無ければ保険で起動
})();

// ===== 画面生成 =====
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function boot(qs){
  QS = qs;
  state = qs.map(q => q.type === 'multi' ? new Set() : '');
  const host = document.getElementById('qhost');
  const N = qs.length;

  host.innerHTML = qs.map((q, i) => {
    const steps = Array.from({length:N}, (_,k) => `<div class="pstep${k<=i?' on':''}"></div>`).join('');
    const last = (i === N - 1);
    const back = i > 0 ? `<button class="btn btn-back" onclick="go(${i-1})">← 戻る</button>` : '';
    let body;
    if (q.type === 'text') {
      body = `<input class="txt" id="txt-${i}" type="text" placeholder="ご自由にご記入ください"
                oninput="onText(${i}, this.value)">`;
    } else {
      body = `<div class="opts" id="opts-${i}"></div>`;
    }
    const btnLabel = last ? '登録へ進む' : '次へ';
    const disabled = (q.type === 'text') ? '' : 'disabled';
    return `
      <div class="view${i===0?' on':''}" id="v-${i}">
        <div class="progress">${steps}</div>
        <div class="q-step">質問 ${i+1} / ${N}</div>
        <div class="q-title">${esc(q.title)}</div>
        <div class="q-note">${q.note ? esc(q.note) : '&nbsp;'}</div>
        ${body}
        <button class="btn btn-red" id="next-${i}" onclick="next(${i})" ${disabled}>${btnLabel}</button>
        ${back}
      </div>`;
  }).join('');

  qs.forEach((q, i) => { if (q.type !== 'text') renderOpts(i, q); });
  cur = 0;
}

const checkIcon = `<svg class="checkmark" viewBox="0 0 11 11" fill="none" stroke="#fff" stroke-width="2"><polyline points="1.5,5.5 4.5,8.5 9.5,2.5"/></svg>`;
const radioIcon = `<svg class="checkmark" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3" fill="#fff"/></svg>`;

function renderOpts(i, q){
  const isMulti = q.type === 'multi';
  const el = document.getElementById('opts-' + i);
  el.innerHTML = q.options.map((text, k) => {
    const cls = isMulti ? 'opt checkbox' : 'opt';
    const fn = isMulti ? `clickMulti(${i},${k})` : `clickSingle(${i},${k})`;
    return `<div class="${cls}" id="opt-${i}-${k}" onclick="${fn}">
      <div class="mark">${isMulti ? checkIcon : radioIcon}</div>
      <div class="opt-text">${esc(text)}</div>
    </div>`;
  }).join('');
}

function clickSingle(i, k){
  document.querySelectorAll('#opts-' + i + ' .opt').forEach(e => e.classList.remove('sel'));
  document.getElementById('opt-' + i + '-' + k).classList.add('sel');
  state[i] = QS[i].options[k];
  document.getElementById('next-' + i).disabled = false;
}

function clickMulti(i, k){
  const val = QS[i].options[k];
  const set = state[i];
  const el = document.getElementById('opt-' + i + '-' + k);
  if (set.has(val)) { set.delete(val); el.classList.remove('sel'); }
  else              { set.add(val);    el.classList.add('sel'); }
  document.getElementById('next-' + i).disabled = set.size === 0;
}

function onText(i, v){ state[i] = v; }

// ===== ナビゲーション =====
function go(i){
  ['v-done'].concat(QS.map((_,k) => 'v-' + k)).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('on', id === ('v-' + i));
  });
  cur = i;
}

function next(i){
  const q = QS[i];
  if (q.type === 'single' && !state[i]) return;
  if (q.type === 'multi' && state[i].size === 0) return;
  if (i < QS.length - 1) go(i + 1);
  else doSubmit();
}

// ===== 送信 =====
function doSubmit(){
  const btn = document.getElementById('next-' + (QS.length - 1));
  if (btn){ btn.disabled = true; btn.textContent = '送信中...'; }

  // 旧GAS（再デプロイ前）でも既存5問を記録できるよう、旧パラメータ名も併走送信する。
  // 新GASでは q_<id> が優先され重複しない。
  const LEGACY_IDS = { age:'age', gender:'gender', referral:'referral', motive:'motive', experience:'experience' };

  const params = new URLSearchParams();
  QS.forEach((q, i) => {
    let v = '';
    if (q.type === 'multi') v = Array.from(state[i]).join(',');
    else v = state[i] || '';
    if (v !== '') {
      params.append('q_' + q.id, v);
      if (LEGACY_IDS[q.id]) params.append(LEGACY_IDS[q.id], v);
    }
  });

  const beacon = new Image();
  beacon.onload  = startRedirect;
  beacon.onerror = startRedirect;
  beacon.src = GAS_URL + '?' + params.toString();
  setTimeout(startRedirect, 3000);
}

let redirected = false;
function startRedirect(){
  if (redirected) return; redirected = true;
  go('done');
  let n = 3;
  const el = document.getElementById('cnt');
  const t = setInterval(() => {
    n--; el.textContent = n;
    if (n <= 0) { clearInterval(t); window.location.href = PPP_URL; }
  }, 1000);
}
</script>
</body>
</html>
