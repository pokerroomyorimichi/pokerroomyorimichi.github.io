<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YORIMICHI Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d12;--surface:#16161f;--surface2:#1e1e2a;--surface3:#252535;
  --red:#E63B10;--red2:#ff5733;--red-dim:rgba(230,59,16,.15);
  --text:#f0f0f5;--sub:#8888a0;--sub2:#555568;
  --green:#22c55e;--amber:#f59e0b;--blue:#3b82f6;
  --border:rgba(255,255,255,.07);
  --r:12px;--shadow:0 8px 32px rgba(0,0,0,.6);
}
body{font-family:-apple-system,'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

/* ===== HEADER ===== */
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.h-logo{font-size:18px;font-weight:700;letter-spacing:4px}
.h-logo span{color:var(--red)}
.h-meta{font-size:11px;color:var(--sub);text-align:right;line-height:1.6}
.h-right{display:flex;align-items:center;gap:12px}
.refresh-btn{background:var(--surface2);border:1px solid var(--border);color:var(--sub);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:12px;transition:all .2s}
.refresh-btn:hover{background:var(--surface3);color:var(--text)}

/* ===== TABS ===== */
.tabs{display:flex;gap:2px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border)}
.tab{padding:12px 20px;font-size:13px;font-weight:500;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--red)}

/* ===== CONTENT ===== */
.content{padding:24px;max-width:1400px;margin:0 auto}
.pane{display:none}.pane.on{display:block}

/* ===== GRID ===== */
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:900px){.grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}

/* ===== CARD ===== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.card-title{font-size:11px;font-weight:600;color:var(--sub);letter-spacing:1px;text-transform:uppercase;margin-bottom:14px}
.card-title-lg{font-size:13px;font-weight:600;color:var(--sub);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}

/* ===== KPI CARD ===== */
.kpi-val{font-size:28px;font-weight:700;line-height:1;letter-spacing:-1px;margin-bottom:6px}
.kpi-val.lg{font-size:36px}
.kpi-sub{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.kpi-bar-wrap{margin-top:12px}
.kpi-bar-track{height:4px;background:var(--surface3);border-radius:2px;overflow:hidden}
.kpi-bar-fill{height:100%;border-radius:2px;transition:width .6s ease}
.kpi-bar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:4px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.badge-green{background:rgba(34,197,94,.15);color:var(--green)}
.badge-amber{background:rgba(245,158,11,.15);color:var(--amber)}
.badge-red{background:rgba(230,59,16,.15);color:var(--red2)}
.badge-blue{background:rgba(59,130,246,.15);color:var(--blue)}

/* ===== SECTION LABEL ===== */
.sec-label{font-size:12px;font-weight:600;color:var(--sub);letter-spacing:1px;text-transform:uppercase;margin:24px 0 12px}

/* ===== CHART WRAPPER ===== */
.chart-wrap{position:relative;height:240px}
.chart-wrap.lg{height:300px}
.chart-wrap.sm{height:160px}

/* ===== FILTER BAR ===== */
.filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.filter-btn{background:var(--surface2);border:1px solid var(--border);color:var(--sub);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:12px;transition:all .2s}
.filter-btn:hover,.filter-btn.on{background:var(--red-dim);border-color:var(--red);color:var(--text)}

/* ===== AI CARD ===== */
.ai-section{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media(max-width:700px){.ai-section{grid-template-columns:1fr}}
.ai-block{background:var(--surface2);border-radius:10px;padding:16px}
.ai-block-title{font-size:11px;font-weight:600;color:var(--sub);letter-spacing:1px;margin-bottom:8px}
.ai-text{font-size:13px;line-height:1.7;color:var(--text)}
.ai-action-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.ai-action-list li{font-size:13px;padding:10px 12px;background:var(--surface3);border-radius:8px;border-left:3px solid var(--red);line-height:1.5}
.ai-proj-bar{margin-top:16px}
.ai-meter{height:10px;background:var(--surface3);border-radius:5px;overflow:hidden;margin:8px 0}
.ai-meter-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--red),var(--red2));transition:width .8s ease}

/* ===== STAT ROW ===== */
.stat-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.stat-chip{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:12px}
.stat-chip span{color:var(--sub);margin-right:4px}

/* ===== LOADING ===== */
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--sub);font-size:13px;gap:10px}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== DIVIDER ===== */
.gap{margin-top:20px}

/* ===== PROGRESS RING ===== */
.ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-center{position:absolute;text-align:center;line-height:1.2}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="h-logo">YORI<span>M</span>ICHI <span style="font-size:11px;color:var(--sub);font-weight:400;letter-spacing:1px">DASHBOARD</span></div>
  <div class="h-right">
    <div class="h-meta" id="updated-at">読み込み中...</div>
    <button class="refresh-btn" onclick="loadAll()">↻ 更新</button>
  </div>
</header>

<!-- TABS -->
<nav class="tabs">
  <div class="tab on" data-tab="summary"    onclick="switchTab('summary')">📊 サマリー</div>
  <div class="tab"    data-tab="yesterday"  onclick="switchTab('yesterday')">📋 前日レポート</div>
  <div class="tab"    data-tab="sales"      onclick="switchTab('sales')">📈 売上分析</div>
  <div class="tab"    data-tab="breakdown"  onclick="switchTab('breakdown')">🧮 内訳分析</div>
  <div class="tab"    data-tab="history"    onclick="switchTab('history')">📅 推移</div>
  <div class="tab"    data-tab="customers"  onclick="switchTab('customers')">👥 来客分析</div>
  <div class="tab"    data-tab="staff"      onclick="switchTab('staff')">👤 スタッフ</div>
  <div class="tab"    data-tab="prediction" onclick="switchTab('prediction')">🤖 AI予測</div>
</nav>

<!-- ========== SUMMARY ========== -->
<div class="pane on content" id="pane-summary">
  <div id="summary-body">
    <div class="loading"><div class="spinner"></div>データを読み込んでいます...</div>
  </div>
</div>

<!-- ========== BREAKDOWN ========== -->
<div class="pane content" id="pane-breakdown">
  <div id="breakdown-body"><div class="loading"><div class="spinner"></div>データを読み込んでいます...</div></div>
</div>

<!-- ========== YESTERDAY ========== -->
<div class="pane content" id="pane-yesterday">
  <div id="yesterday-body"><div class="loading"><div class="spinner"></div>データを読み込んでいます...</div></div>
</div>

<!-- ========== SALES ========== -->
<div class="pane content" id="pane-sales">
  <div id="sales-body">
    <div class="loading"><div class="spinner"></div>データを読み込んでいます...</div>
  </div>
</div>

<!-- ========== HISTORY ========== -->
<div class="pane content" id="pane-history">
  <div id="history-body">
    <div class="loading"><div class="spinner"></div>データを読み込んでいます...</div>
  </div>
</div>

<!-- ========== CUSTOMERS ========== -->
<div class="pane content" id="pane-customers">
  <div id="customers-body"><div class="loading"><div class="spinner"></div>データを読み込んでいます...</div></div>
</div>

<!-- ========== STAFF ========== -->
<div class="pane content" id="pane-staff">
  <div id="staff-body"><div class="loading"><div class="spinner"></div>データを読み込んでいます...</div></div>
</div>

<!-- ========== AI PREDICTION ========== -->
<div class="pane content" id="pane-prediction">
  <div id="prediction-body">
    <div class="loading"><div class="spinner"></div>AI分析を生成中（初回は30秒ほどかかります）...</div>
  </div>
</div>

<script>
// ================================================================
// ★ GASデプロイ後にURLを設定
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyiC7MvEYZYfWblV1ov3Fe6fUhFx8blcQJR4cEK_Pr-mi5y-abDZVmEVDm_4tOFEBH3/exec';
// ================================================================

const COLOR = {
  red:    '#E63B10', red2: '#ff5733', redA: 'rgba(230,59,16,.25)',
  green:  '#22c55e', greenA: 'rgba(34,197,94,.2)',
  amber:  '#f59e0b', amberA: 'rgba(245,158,11,.2)',
  blue:   '#3b82f6', blueA:  'rgba(59,130,246,.2)',
  sub:    '#8888a0', subA:   'rgba(136,136,160,.15)',
  surface:'#1e1e2a',
};

Chart.defaults.color          = COLOR.sub;
Chart.defaults.borderColor    = 'rgba(255,255,255,.06)';
Chart.defaults.font.family    = "-apple-system,'Noto Sans JP',sans-serif";
Chart.defaults.font.size      = 11;

const charts = {};
let   summaryData, salesMonthly, salesDaily;

// ===== API =====
// JSONP方式でGASを呼び出す（CORS不要・タイムアウト25秒）
function api(action, params = {}) {
  return new Promise((resolve) => {
    const cbName = '_cb' + Date.now() + Math.random().toString(36).slice(2);
    const qs     = new URLSearchParams({ action, callback: cbName, ...params }).toString();
    const script = document.createElement('script');
    const timer  = setTimeout(() => {
      cleanup();
      resolve({ ok: false, error: 'タイムアウト（25秒）。GASの実行に時間がかかっています。' });
    }, 25000);
    const cleanup = () => {
      clearTimeout(timer);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    };
    window[cbName] = (data) => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); resolve({ ok: false, error: 'スクリプト読み込みエラー。GAS URLを確認してください。' }); };
    script.src = `${GAS_URL}?${qs}`;
    document.head.appendChild(script);
  });
}

// ===== TABS =====
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === tab));
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('on'));
  document.getElementById('pane-' + tab).classList.add('on');
  if (tab === 'sales'      && !salesMonthly)        loadSales();
  if (tab === 'breakdown' && !window._bdLoaded)    loadBreakdown();
  if (tab === 'yesterday' && !window._ydLoaded)    loadYesterday();
  if (tab === 'history'   && !window._histLoaded)  loadHistory();
  if (tab === 'customers' && !window._custLoaded)  loadCustomers();
  if (tab === 'staff'     && !window._staffLoaded) loadStaff();
  if (tab === 'prediction' && !window._predLoaded)  loadPrediction();
}

// ===== FORMAT =====
const yen  = v => '¥' + Math.round(v).toLocaleString();
const pct  = v => (v != null ? v.toFixed(1) + '%' : '-');
const num  = v => v != null ? v.toLocaleString() : '-';

function badge(rate) {
  if (rate == null) return '';
  if (rate >= 100) return `<span class="badge badge-green">${pct(rate)}</span>`;
  if (rate >=  80) return `<span class="badge badge-amber">${pct(rate)}</span>`;
  return `<span class="badge badge-red">${pct(rate)}</span>`;
}

// ===== SUMMARY =====
async function loadSummary() {
  try {
    const d = await api('summary');
    if (!d.ok) { document.getElementById('summary-body').innerHTML = `<div style="color:var(--red2);padding:40px;font-size:13px">⚠ エラー: ${d.error}</div>`; return; }
    summaryData = d;
    document.getElementById('updated-at').textContent = '最終更新: ' + d.updatedAt;
    renderSummary(d);
  } catch (err) {
    document.getElementById('summary-body').innerHTML = `<div style="color:var(--red2);padding:40px;font-size:13px">⚠ 読み込みエラー: ${err.message}</div>`;
  }
}

function renderSummary(d) {
  const s = d.sales, c = d.customers, u = d.unitPrice;

  document.getElementById('summary-body').innerHTML = `
    <div class="sec-label">今月のKPI — ${d.month}</div>
    <div class="grid4">
      ${kpiCard('今月売上', yen(s.actual), badge(s.rate),
        s.target ? `目標 ${yen(s.target)}` : '',
        s.rate, barColor(s.rate))}
      ${kpiCard('来客数', num(c.total) + '人', badge(c.rate),
        c.target ? `目標 ${num(c.target)}人` : '目標未設定',
        c.rate, barColor(c.rate))}
      ${kpiCard('客単価', yen(u.actual), badge(u.actual >= u.target ? 100 : u.actual/u.target*100),
        `目標 ${yen(u.target)}`,
        u.actual/u.target*100, barColor(u.actual/u.target*100))}
      ${kpiCard('損益分岐点', pct(s.bepRate), s.bepRate >= 100 ? '<span class="badge badge-green">達成</span>' : '<span class="badge badge-amber">未達</span>',
        `BEP ${yen(s.bep)}`,
        s.bepRate, s.bepRate >= 100 ? COLOR.green : COLOR.amber)}
    </div>

    <div class="gap"></div>
    <div class="grid2">
      <div class="card">
        <div class="card-title-lg">月末着地予測
          <span style="font-size:12px;color:var(--sub)">現ペース外挿</span>
        </div>
        <div style="font-size:32px;font-weight:700;letter-spacing:-1px">${yen(s.projected)}</div>
        <div style="margin-top:6px;font-size:12px;color:var(--sub)">
          目標対比 ${s.target ? badge(s.projected/s.target*100) : '-'}
          &nbsp;|&nbsp; 目標まで残り ${s.remaining != null ? yen(Math.max(0, s.remaining)) : '-'}
        </div>
        <div class="kpi-bar-wrap" style="margin-top:16px">
          <div class="kpi-bar-track"><div class="kpi-bar-fill" style="width:${Math.min(100,s.bepRate)}%;background:${s.bepRate>=100?COLOR.green:COLOR.amber}"></div></div>
          <div class="kpi-bar-label"><span>BEP進捗</span><span>${pct(s.bepRate)}</span></div>
        </div>
      </div>
      <div class="card">
        <div class="card-title-lg">新規 vs リピート</div>
        <div style="display:flex;align-items:center;gap:20px">
          <div style="flex:1"><canvas id="chart-donut"></canvas></div>
          <div style="font-size:13px;line-height:2">
            <div><span style="color:var(--red)">●</span> 新規 ${num(c.new)}人</div>
            <div><span style="color:var(--blue)">●</span> リピート ${num(c.repeat)}人</div>
            <div style="color:var(--sub);font-size:11px;margin-top:4px">合計 ${num(c.total)}人</div>
          </div>
        </div>
      </div>
    </div>

    <div class="gap"></div>
    <div class="card">
      <div class="card-title-lg">直近7営業日トレンド</div>
      <div class="chart-wrap"><canvas id="chart-trend"></canvas></div>
    </div>
  `;

  // Donut
  mkChart('chart-donut', 'doughnut', {
    labels: ['新規', 'リピート'],
    datasets: [{ data: [c.new, c.repeat], backgroundColor: [COLOR.red, COLOR.blue], borderWidth: 0, hoverOffset: 4 }]
  }, { plugins: { legend: { display: false } }, cutout: '68%' });

  // Trend
  const t7 = d.trend7;
  mkChart('chart-trend', 'bar', {
    labels: t7.map(r => r.date),
    datasets: [
      { label: '売上', data: t7.map(r => r.sales), backgroundColor: COLOR.redA, borderColor: COLOR.red, borderWidth: 2, yAxisID: 'y', type: 'bar' },
      { label: '来客', data: t7.map(r => r.customers), borderColor: COLOR.blue, backgroundColor: 'transparent', borderWidth: 2, yAxisID: 'y1', type: 'line', tension: .4, pointRadius: 4 },
    ]
  }, {
    scales: {
      y:  { position: 'left',  ticks: { callback: v => '¥' + (v/10000).toFixed(0) + '万' } },
      y1: { position: 'right', grid: { drawOnChartArea: false }, ticks: { callback: v => v + '人' } },
    }
  });
}

// ===== SALES =====
async function loadSales() {
  document.getElementById('sales-body').innerHTML = '<div class="loading"><div class="spinner"></div>読み込み中...</div>';
  try {
    const [m, d] = await Promise.all([
      api('sales', { period: 'monthly' }),
      api('sales', { period: 'daily',   months: 2 }),
    ]);
    if (!m.ok) { document.getElementById('sales-body').innerHTML = `<div style="color:var(--red2);padding:40px;font-size:13px">⚠ エラー: ${m.error}</div>`; return; }
    salesMonthly = m.data || [];
    salesDaily   = d.data || [];
    renderSales('monthly');
  } catch (err) {
    document.getElementById('sales-body').innerHTML = `<div style="color:var(--red2);padding:40px;font-size:13px">⚠ 読み込みエラー: ${err.message}</div>`;
  }
}

function renderSales(mode) {
  document.getElementById('sales-body').innerHTML = `
    <div class="filter-bar">
      <button class="filter-btn ${mode==='monthly'?'on':''}" onclick="renderSales('monthly')">月次</button>
      <button class="filter-btn ${mode==='daily'  ?'on':''}" onclick="renderSales('daily')">日次（直近2ヶ月）</button>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="card-title-lg">売上推移 ${mode==='monthly'?'（月次）':'（日次）'}</div>
        <div class="chart-wrap lg"><canvas id="chart-sales-main"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title-lg">来客数推移 ${mode==='monthly'?'（月次）':'（日次）'}</div>
        <div class="chart-wrap lg"><canvas id="chart-cust-main"></canvas></div>
      </div>
    </div>
    ${mode === 'monthly' ? renderMonthlyTable() : ''}
  `;

  if (mode === 'monthly') {
    const data = salesMonthly;
    const lbls = data.map(r => r.label);
    mkChart('chart-sales-main', 'bar', {
      labels: lbls,
      datasets: [
        { label: '売上',   data: data.map(r => r.sales),  backgroundColor: COLOR.redA, borderColor: COLOR.red, borderWidth: 2 },
        { label: '目標',   data: data.map(r => r.target), type: 'line', borderColor: COLOR.amber, borderDash: [4,3], borderWidth: 1.5, backgroundColor: 'transparent', pointRadius: 0 },
        { label: 'BEP',    data: data.map(() => BEP),      type: 'line', borderColor: COLOR.sub,   borderDash: [2,4], borderWidth: 1, backgroundColor: 'transparent', pointRadius: 0 },
      ]
    }, { scales: { y: { ticks: { callback: v => '¥' + (v/10000).toFixed(0) + '万' } } } });

    mkChart('chart-cust-main', 'bar', {
      labels: lbls,
      datasets: [{ label: '来客数', data: data.map(r => r.customers), backgroundColor: COLOR.blueA, borderColor: COLOR.blue, borderWidth: 2 }]
    }, { scales: { y: { ticks: { callback: v => v + '人' } } } });
  } else {
    const data = salesDaily;
    const lbls = data.map(r => r.date.slice(5) + '(' + r.dow + ')');
    mkChart('chart-sales-main', 'bar', {
      labels: lbls,
      datasets: [{ label: '売上', data: data.map(r => r.sales), backgroundColor: COLOR.redA, borderColor: COLOR.red, borderWidth: 1.5 }]
    }, { scales: { y: { ticks: { callback: v => '¥' + (v/10000).toFixed(0) + '万' } } } });

    mkChart('chart-cust-main', 'bar', {
      labels: lbls,
      datasets: [
        { label: 'リピート', data: data.map(r => r.repeat), backgroundColor: COLOR.blueA, borderColor: COLOR.blue, borderWidth: 1.5, stack: 's' },
        { label: '新規',     data: data.map(r => r.newC),   backgroundColor: COLOR.redA,  borderColor: COLOR.red,  borderWidth: 1.5, stack: 's' },
      ]
    }, { scales: { y: { stacked: true, ticks: { callback: v => v + '人' } } } });
  }
}

function renderMonthlyTable() {
  const rows = salesMonthly.map(r => {
    const rate = r.target ? Math.round(r.sales / r.target * 100) : null;
    const bc   = rate == null ? '' : rate >= 100 ? 'badge-green' : rate >= 80 ? 'badge-amber' : 'badge-red';
    return `<tr>
      <td>${r.label}</td>
      <td>${yen(r.sales)}</td>
      <td>${r.target ? yen(r.target) : '-'}</td>
      <td>${rate != null ? `<span class="badge ${bc}">${rate}%</span>` : '-'}</td>
      <td>${num(r.customers)}人</td>
      <td>${r.customers > 0 ? yen(Math.round(r.sales/r.customers)) : '-'}</td>
    </tr>`;

      : '-';
    const rateBc = r.rate == null ? '' : r.rate >= 100 ? 'badge-green' : r.rate >= 80 ? 'badge-amber' : 'badge-red';
    const bepBc  = r.bepRate >= 100 ? 'badge-green' : 'badge-amber';
    return `<tr style="border-bottom:1px solid var(--border)">
      <td style="padding:8px 6px;font-weight:600">${r.label}</td>
      <td style="text-align:right;padding:8px 6px">${yen(r.sales)}</td>

      <td style="text-align:right;padding:8px 6px">${yen(r.unitPrice)}</td>

  document.getElementById('history-body').innerHTML = `
    <div class="sec-label">オープン以来の全記録 — 2025/08〜現在（${s.totalMonths}ヶ月）</div>

    <div class="grid4" style="margin-bottom:20px">
      <div class="card">

      </div>

        <div class="card-title">月平均売上</div>
        <div class="kpi-val">${yen(s.avgSales)}</div>
        <div class="kpi-sub"><span style="color:var(--sub)">最高: ${s.bestMonth} ${yen(s.bestSales)}</span></div>
      </div>
      <div class="card">
        <div class="card-title">BEP達成月</div>
        <div class="kpi-val">${s.bepMonths}<span style="font-size:16px;font-weight:400"> / ${s.totalMonths}ヶ月</span></div>
        <div class="kpi-sub"><span style="color:${bepMonthsPct >= 50 ? COLOR.green : COLOR.amber}">${bepMonthsPct}%の月で達成</span></div>
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <div class="card-title-lg">月次売上推移</div>
        <div class="chart-wrap lg"><canvas id="chart-hist-sales"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title-lg">月次来客数推移</div>
        <div class="chart-wrap lg"><canvas id="chart-hist-cust"></canvas></div>
      </div>
    </div>

    <div class="gap"></div>
    <div class="card" style="overflow-x:auto">
      <div class="card-title-lg">月別実績詳細</div>
      <table style="width:100%;border-collapse:collapse;font-size:13px;min-width:600px">

          <th style="text-align:right;padding:8px 6px">来客数</th>

  game:  { label:'ゲーム系',  color:'#E63B10', items:['入場料','体験会','チップ(リング)','トーナメント'] },
  drink: { label:'飲食系',   color:'#3b82f6', items:['単品AL','単品NA','FREE-AL','FREE-NA','ボトル','スタッフドリンク','フード'] },
  other: { label:'その他',   color:'#f59e0b', items:['その他','販売'] },
  rake:  { label:'収益調整', color:'#22c55e', items:['レーキ','コミッション','PD収支'] },
};

async function loadBreakdown(months) {
  window._bdLoaded = true;
  months = months || 6;
  document.getElementById('breakdown-body').innerHTML = '<div class="loading"><div class="spinner"></div>内訳データを読み込んでいます...</div>';
  try {
    const res = await api('breakdown', { period: 'monthly', months });
    if (!res.ok) { document.getElementById('breakdown-body').innerHTML = `<div style="color:var(--red2);padding:40px;font-size:13px">⚠ ${res.error}</div>`; return; }
    renderBreakdown(res, months);
  } catch(e) { document.getElementById('breakdown-body').innerHTML = `<div style="color:var(--red2);padding:40px;font-size:13px">⚠ ${e.message}</div>`; }
}

function renderBreakdown(res, months) {
  const data = res.data || [];
  const tot  = res.totals || {};
  const totalSales = tot.total || 1;

  const pct = v => totalSales > 0 ? (v / totalSales * 100).toFixed(1) + '%' : '-';

  // 構成比カード
  const catCards = Object.entries(CAT).map(([key, cat]) => {
    const v = tot[key] || 0;
    const r = totalSales > 0 ? Math.round(v / totalSales * 100) : 0;
    return `<div class="card">
      <div class="card-title" style="display:flex;align-items:center;gap:6px">
        <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${cat.color}"></span>
        ${cat.label}
      </div>
      <div class="kpi-val">${yen(v)}</div>
      <div style="margin-top:8px">
        <div class="kpi-bar-track"><div class="kpi-bar-fill" style="width:${r}%;background:${cat.color}"></div></div>
        <div class="kpi-bar-label"><span>${cat.items.join('・')}</span><span>${r}%</span></div>
      </div>
    </div>`;
  }).join('');

  // 詳細項目テーブル（月次）
  const detailKeys = [
    ['nyujo','入場料'],['taiken','体験会'],['chip','チップ(リング)'],['toname','トーナメント'],
    ['tanpin_al','単品AL'],['tanpin_na','単品NA'],['free_al','FREE-AL'],['free_na','FREE-NA'],
    ['bottle','ボトル'],['staff_dr','スタッフドリンク'],['food','フード'],
    ['other','その他'],['sale','販売'],
    ['rake','レーキ'],['commission','コミッション'],['pd','PD収支']
  ];
  const detailRows = detailKeys.map(([k, lbl]) => {
    const catKey = ['nyujo','taiken','chip','toname'].includes(k) ? 'game'
      : ['tanpin_al','tanpin_na','free_al','free_na','bottle','staff_dr','food'].includes(k) ? 'drink'
      : ['other','sale'].includes(k) ? 'other' : 'rake';
    const catColor = CAT[catKey].color;
    const monthCells = data.map(m => {
      const v = m[k] || 0;
      return `<td style="text-align:right;padding:6px 8px">${v > 0 ? yen(v) : '<span style="color:var(--sub2)">-</span>'}</td>`;
    }).join('');
    return `<tr style="border-bottom:1px solid var(--border)">
      <td style="padding:6px 8px">
        <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${catColor};margin-right:6px"></span>
        ${lbl}
      </td>
      ${monthCells}
    </tr>`;
  }).join('');

  const monthHeaders = data.map(m => `<th style="text-align:right;padding:6px 8px;min-width:90px">${m.label}</th>`).join('');

  document.getElementById('breakdown-body').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div class="sec-label" style="margin:0">売上内訳分析</div>
      <div class="filter-bar" style="margin:0">
        ${[3,6,12].map(m => `<button class="filter-btn ${m===months?'on':''}" onclick="loadBreakdown(${m})">${m}ヶ月</button>`).join('')}
      </div>
    </div>

    <div class="grid4" style="margin-bottom:20px">${catCards}</div>

    <div class="grid2" style="margin-bottom:16px">
      <div class="card">
        <div class="card-title-lg">カテゴリ構成比</div>
        <div class="chart-wrap"><canvas id="chart-bd-pie"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title-lg">月次カテゴリ推移（積み上げ）</div>
        <div class="chart-wrap"><canvas id="chart-bd-stack"></canvas></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="card-title-lg">ゲーム系 詳細推移</div>
      <div class="chart-wrap"><canvas id="chart-bd-game"></canvas></div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="card-title-lg">飲食系 詳細推移</div>
      <div class="chart-wrap"><canvas id="chart-bd-drink"></canvas></div>
    </div>

    <div class="card" style="overflow-x:auto">
      <div class="card-title-lg">月別・項目別 詳細一覧</div>
      <table style="width:100%;border-collapse:collapse;font-size:12px;min-width:600px">
        <thead><tr style="color:var(--sub);border-bottom:1px solid var(--border)">
          <th style="text-align:left;padding:6px 8px;min-width:120px">項目</th>
          ${monthHeaders}
        </tr></thead>
        <tbody>${detailRows}</tbody>
      </table>
    </div>
  `;

  const lbls = data.map(d => d.label);
  const catKeys = ['game','drink','other','rake'];

  // 構成比ドーナツ
  mkChart('chart-bd-pie', 'doughnut', {
    labels: Object.values(CAT).map(c => c.label),
    datasets: [{ data: catKeys.map(k => tot[k]||0), backgroundColor: Object.values(CAT).map(c => c.color), borderWidth: 0, hoverOffset: 6 }]
  }, { plugins: { legend: { position: 'bottom', labels: { padding: 12, boxWidth: 12 } } } });

  // 積み上げ棒グラフ
  mkChart('chart-bd-stack', 'bar', {
    labels: lbls,
    datasets: catKeys.map(k => ({
      label: CAT[k].label,
      data:  data.map(d => d[k]||0),
      backgroundColor: CAT[k].color + '99',
      borderColor:     CAT[k].color,
      borderWidth: 1.5,
      stack: 's'
    }))
  }, { scales: { y: { stacked: true, ticks: { callback: v => '¥' + (v/10000).toFixed(0) + '万' } } } });

  // ゲーム系詳細
  const gameItems = [['chip','チップ(リング)',COLOR.red],['toname','トーナメント','#ff5733'],['nyujo','入場料','#fb923c'],['taiken','体験会','#fbbf24']];
  mkChart('chart-bd-game', 'bar', {
    labels: lbls,
    datasets: gameItems.map(([k,lbl,col]) => ({
      label: lbl, data: data.map(d => d[k]||0),
      backgroundColor: col + '99', borderColor: col, borderWidth: 1.5, stack: 's'
    }))
  }, { scales: { y: { stacked: true, ticks: { callback: v => '¥' + (v/10000).toFixed(0) + '万' } } } });

  // 飲食系詳細
  const drinkItems = [['bottle','ボトル','#3b82f6'],['tanpin_al','単品AL','#60a5fa'],['free_al','FREE-AL','#93c5fd'],['food','フード','#22c55e'],['tanpin_na','単品NA','#86efac'],['free_na','FREE-NA','#bbf7d0'],['staff_dr','スタッフドリンク','#94a3b8']];
  mkChart('chart-bd-drink', 'bar', {
    labels: lbls,
    datasets: drinkItems.map(([k,lbl,col]) => ({
      label: lbl, data: data.map(d => d[k]||0),
      backgroundColor: col + '99', borderColor: col, borderWidth: 1.5, stack: 's'
    }))
  }, { scales: { y: { stacked: true, ticks: { callback: v => '¥' + (v/10000).toFixed(0) + '万' } } } });
}

  document.getElementById('customers-body').innerHTML = `

    <div class="grid3" style="margin-bottom:20px">
      <div class="card">
        <div class="card-title">今月 新規来客</div>
        <div class="kpi-val">${num(curMonth.newC || 0)}<span style="font-size:14px;font-weight:400">人</span></div>
        <div class="kpi-sub"><span style="color:var(--sub)">新規率 ${curMonth.newRate || 0}%</span></div>
      </div>
      <div class="card">
        <div class="card-title">今月 リピーター</div>
        <div class="kpi-val">${num(curMonth.repeat || 0)}<span style="font-size:14px;font-weight:400">人</span></div>
        <div class="kpi-sub"><span style="color:var(--sub)">リピート率 ${100 - (curMonth.newRate || 0)}%</span></div>
      </div>
      <div class="card">
        <div class="card-title">アンケート回答数</div>
        <div class="kpi-val">${num(total)}<span style="font-size:14px;font-weight:400">件</span></div>
        <div class="kpi-sub"><span style="color:var(--sub)">累計回答数</span></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="card-title-lg">新規 / リピート 月次推移</div>
      <div class="chart-wrap"><canvas id="chart-cust-trend"></canvas></div>
    </div>

    <div class="grid3">
      <div class="card">
        <div class="card-title-lg">流入経路（Q1）</div>
        <div class="chart-wrap"><canvas id="chart-referral"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title-lg">来店の決め手（Q2）</div>
        <div class="chart-wrap"><canvas id="chart-motive"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title-lg">ポーカー経験（Q3）</div>
        <div class="chart-wrap"><canvas id="chart-experience"></canvas></div>
      </div>
    </div>
  `;

  // 新規/リピート推移
  mkChart('chart-cust-trend', 'bar', {
    labels: trend.map(r => r.label),
    datasets: [
      { label: 'リピーター', data: trend.map(r => r.repeat), backgroundColor: COLOR.blueA, borderColor: COLOR.blue, borderWidth: 1.5, stack: 's' },
      { label: '新規',       data: trend.map(r => r.newC),   backgroundColor: COLOR.redA,  borderColor: COLOR.red,  borderWidth: 1.5, stack: 's' },
    ]
  }, { scales: { y: { stacked: true, ticks: { callback: v => v + '人' } } } });

  // 流入経路
  const barColors = [COLOR.red, COLOR.blue, COLOR.amber, COLOR.green, '#a855f7', '#06b6d4', '#ec4899', COLOR.sub];
  mkChart('chart-referral', 'bar', {
    labels: refs.map(r => r.label),
    datasets: [{ label: '件数', data: refs.map(r => r.count), backgroundColor: refs.map((_,i) => barColors[i % barColors.length] + '66'), borderColor: refs.map((_,i) => barColors[i % barColors.length]), borderWidth: 2 }]
  }, { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { ticks: { callback: v => v + '件' } } } });

  // 来店動機
  mkChart('chart-motive', 'bar', {
    labels: mots.map(r => r.label),
    datasets: [{ label: '件数', data: mots.map(r => r.count), backgroundColor: mots.map((_,i) => barColors[i % barColors.length] + '66'), borderColor: mots.map((_,i) => barColors[i % barColors.length]), borderWidth: 2 }]
  }, { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { ticks: { callback: v => v + '件' } } } });

  // ポーカー経験
  const expColors = [COLOR.green, COLOR.blue, COLOR.amber, COLOR.red];
  mkChart('chart-experience', 'doughnut', {
    labels: exps.map(r => r.label),
    datasets: [{ data: exps.map(r => r.count), backgroundColor: expColors, borderWidth: 0, hoverOffset: 6 }]
  }, { plugins: { legend: { position: 'bottom', labels: { padding: 12, boxWidth: 12 } } } });
}

// ===== STAFF =====
async function loadStaff() {
  window._staffLoaded = true;
  document.getElementById('staff-body').innerHTML = '<div class="loading"><div class="spinner"></div>スタッフデータを読み込んでいます...</div>';
  try {
    const res = await api('staff');
    if (!res.ok) { document.getElementById('staff-body').innerHTML = `<div style="color:var(--red2);padding:40px;font-size:13px">⚠ ${res.error}</div>`; return; }
    renderStaff(res);
  } catch(e) { document.getElementById('staff-body').innerHTML = `<div style="color:var(--red2);padding:40px;font-size:13px">⚠ ${e.message}</div>`; }
}

function renderStaff(res) {
  const stats = res.staffStats || [];
  const mh = m => `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`;
  const stateMap = { working: ['勤務中', COLOR.green], break: ['休憩中', COLOR.amber], done: ['退勤済', COLOR.sub], absent: ['未出勤', COLOR.sub2] };

  const todayRows = stats.filter(s => s.todayState !== 'absent').map(s => {
    const [lbl, col] = stateMap[s.todayState] || ['不明', COLOR.sub];
    return `<div class="opt" style="cursor:default;gap:12px">
      <div style="width:8px;height:8px;border-radius:50%;background:${col};flex-shrink:0"></div>
      <div style="flex:1;font-weight:600">${s.name}</div>
      <div style="font-size:12px;color:${col}">${lbl}</div>
      <div style="font-size:12px;color:var(--sub)">${s.todayIn !== '-' ? s.todayIn + ' IN' : ''}</div>
    </div>`;
  }).join('') || `<div style="color:var(--sub);font-size:13px;padding:12px">本日の出勤記録なし</div>`;

  const tableRows = stats.map(s => `
    <tr style="border-bottom:1px solid var(--border)">
      <td style="padding:10px 6px;font-weight:600">${s.name}</td>
      <td style="text-align:center;padding:10px 6px">${s.days}日</td>
      <td style="text-align:right;padding:10px 6px">${mh(s.totalWorkMin)}</td>
      <td style="text-align:right;padding:10px 6px;color:var(--amber)">${mh(s.totalLateMin)}</td>
      <td style="text-align:right;padding:10px 6px">${mh(s.normalMin)}</td>
    </tr>`).join('');

  document.getElementById('staff-body').innerHTML = `
    <div class="sec-label">${res.month} スタッフ稼働状況</div>

    <div class="grid2" style="margin-bottom:20px">
      <div class="card">
        <div class="card-title-lg">本日の出勤状況 <span style="font-size:11px;color:var(--sub)">${res.today}</span></div>
        <div style="display:flex;flex-direction:column;gap:8px">${todayRows}</div>
      </div>
      <div class="card">
        <div class="card-title-lg">今月 稼働時間グラフ</div>
        <div class="chart-wrap"><canvas id="chart-staff-hours"></canvas></div>
      </div>
    </div>

    <div class="card" style="overflow-x:auto">
      <div class="card-title-lg">今月 スタッフ別稼働詳細</div>
      <table style="width:100%;border-collapse:collapse;font-size:13px;min-width:500px">
        <thead><tr style="color:var(--sub);border-bottom:1px solid var(--border)">
          <th style="text-align:left;padding:8px 6px">スタッフ</th>
          <th style="text-align:center;padding:8px 6px">出勤日数</th>
          <th style="text-align:right;padding:8px 6px">合計稼働</th>
          <th style="text-align:right;padding:8px 6px">深夜稼働</th>
          <th style="text-align:right;padding:8px 6px">通常稼働</th>
        </tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>
  `;

  mkChart('chart-staff-hours', 'bar', {
    labels: stats.map(s => s.name),
    datasets: [
      { label: '通常稼働', data: stats.map(s => Math.round(s.normalMin/60*10)/10),  backgroundColor: COLOR.blueA, borderColor: COLOR.blue, borderWidth: 1.5, stack: 's' },
      { label: '深夜稼働', data: stats.map(s => Math.round(s.totalLateMin/60*10)/10), backgroundColor: COLOR.redA,  borderColor: COLOR.red,  borderWidth: 1.5, stack: 's' },
    ]
  }, { scales: { y: { stacked: true, ticks: { callback: v => v + 'h' } } } });
}

// ===== AI PREDICTION =====
const BEP = 1771671;
async function loadPrediction() {
  window._predLoaded = true;
  document.getElementById('prediction-body').innerHTML = '<div class="loading"><div class="spinner"></div>AI分析を生成中（初回は30秒ほどかかります）...</div>';

    document.getElementById('prediction-body').innerHTML = `<div style="color:var(--red);padding:40px">エラー: ${res.error}</div>`;

function renderPrediction(d, cached) {
  const ai   = d.ai || {};
  const rate = d.projectionRate;
  const bc   = rate == null ? '' : rate >= 100 ? 'badge-green' : rate >= 80 ? 'badge-amber' : 'badge-red';

  document.getElementById('prediction-body').innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
      <div style="font-size:11px;color:var(--sub)">AI分析 生成日時: ${d.generatedAt}${cached ? '（キャッシュ）' : '（新規生成）'}</div>
    </div>

    <div class="grid3">
      <div class="card">
        <div class="card-title">月末着地予測</div>
        <div style="font-size:30px;font-weight:700;letter-spacing:-1px">${yen(d.projectedSales)}</div>
        <div style="margin-top:6px">${rate != null ? `<span class="badge ${bc}">目標対比 ${rate}%</span>` : ''}</div>
        <div class="ai-meter">
          <div class="ai-meter-fill" style="width:${Math.min(100,rate||0)}%"></div>
        </div>
        <div style="font-size:11px;color:var(--sub)">目標 ${yen(d.targetSales||0)}</div>
      </div>
      <div class="card" style="grid-column:span 2">
        <div class="card-title">予測根拠</div>
        <div class="ai-text">${ai.forecast || '-'}</div>
        <div style="margin-top:10px;font-size:12px;color:var(--sub);border-top:1px solid var(--border);padding-top:10px">${ai.trend || ''}</div>
      </div>
    </div>

    <div class="gap"></div>
    <div class="grid2">
      <div class="card">
        <div class="card-title">推奨アクション</div>
        <ul class="ai-action-list">
          ${(ai.actions || []).map((a, i) => `<li><span style="color:var(--sub);font-size:11px;margin-right:6px">${['今すぐ','今週中','今月中'][i]||''}</span>${a}</li>`).join('')}
        </ul>
      </div>
      <div class="card">
        <div class="card-title" style="margin-bottom:12px">リスク & チャンス</div>
        <div class="ai-block" style="margin-bottom:12px;border-left:3px solid var(--red)">
          <div class="ai-block-title">⚠ リスク</div>
          <div class="ai-text">${ai.risk || '-'}</div>
        </div>
        <div class="ai-block" style="border-left:3px solid var(--green)">
          <div class="ai-block-title">✦ チャンス</div>
          <div class="ai-text">${ai.opportunity || '-'}</div>
        </div>
      </div>
    </div>
  `;
}

// ===== CHART HELPER =====
function mkChart(id, type, data, extraOpts = {}) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
  const ctx = document.getElementById(id);
  if (!ctx) return;
  charts[id] = new Chart(ctx, {
    type,
    data,
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { boxWidth: 10, padding: 12 } } },
      ...extraOpts
    }
  });
}

function barColor(rate) {
  if (rate == null) return COLOR.sub;
  if (rate >= 100)  return COLOR.green;
  if (rate >= 80)   return COLOR.amber;
  return COLOR.red;
}

function kpiCard(label, val, badgeHtml, sub, rate, color) {
  const w = Math.min(100, Math.max(0, rate || 0));
  return `<div class="card">
    <div class="card-title">${label}</div>
    <div class="kpi-val">${val}</div>
    <div class="kpi-sub">${badgeHtml} <span>${sub||''}</span></div>
    <div class="kpi-bar-wrap">
      <div class="kpi-bar-track"><div class="kpi-bar-fill" style="width:${w}%;background:${color}"></div></div>
    </div>
  </div>`;
}
